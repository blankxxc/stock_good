[project]
name = "stock-good"
version = "0.1.0"
description = "Local full-stack intelligent stock-selection research platform with daily CSI300 research data, factor pipelines, backtesting, RAG evidence, governance, and web console."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "pytest",
    "pyspark==3.5.3",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "httpx>=0.28.1",
    "httpx2>=2.3.0",
    "duckdb>=1.4.0",
    "pandas>=2.3.0",
    "pyarrow>=18.0.0",
    "polars>=1.35.0",
    "networkx>=3.5",
    "pyqlib==0.9.7",
    "akshare>=1.18.64",
    "baostock>=0.9.2",
    "lightgbm>=4.6.0",
]

[project.optional-dependencies]
cograsp = [
    "numpy==1.26.4",
    "torch==2.2.2",
    "torch-geometric==2.5.2",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
