table: ods_market_daily_raw
layer: ODS
schema_version: v0.2.0
description: Daily research OHLC with separate unadjusted prices and nullable historical ST status; adj_factor is adjusted close divided by raw_close, null when unavailable.
primary_key: [trade_date, symbol]
unique_key: [trade_date, symbol]
