global:
  scrape_interval: 15s
scrape_configs:
  - job_name: backend
    metrics_path: /health
    static_configs:
      - targets: ['127.0.0.1:8000']
  - job_name: spark
    static_configs:
      - targets: ['127.0.0.1:8080']
  - job_name: clickhouse
    static_configs:
      - targets: ['127.0.0.1:8123']
  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:5432']
