name: stock-good-foundation
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.example
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock_good}
      POSTGRES_DB: ${POSTGRES_DB:-stock_good}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  redpanda:
    image: redpandadata/redpanda:latest
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "redpanda:9092"]
    ports: ["9092:9092", "9644:9644"]
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java17
    command: jobmanager
    ports: ["8081:8081"]
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
  flink-taskmanager:
    image: flink:1.19-scala_2.12-java17
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    depends_on: [flink-jobmanager]
  spark-master:
    image: bitnamilegacy/spark:3.5
    environment:
      - SPARK_MODE=master
    ports: ["7077:7077", "8080:8080"]
  spark-worker:
    image: bitnamilegacy/spark:3.5
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on: [spark-master]
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports: ["8123:8123", "9000:9000"]
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    ports: ["8000:8000"]
    depends_on: [postgres, redis, redpanda, qdrant, clickhouse]
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    command: ["python", "-m", "backend.app.workers.foundation_worker"]
    environment:
      WORKER_ROLE: foundation-scaffold-worker
    depends_on: [postgres, redis, redpanda, qdrant, clickhouse]
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    depends_on: [backend]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
  backup:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do sleep 3600; done"]
volumes:
  postgres-data:
